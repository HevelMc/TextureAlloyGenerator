[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texture-alloy"
version = "0.1.0"
description = "Moonaris-alliages texture generator for Minecraft 26.2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["texture_alloy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
